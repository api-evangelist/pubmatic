source: >-
  CocoaPods trunk API, pub.dev API, registry.npmjs.org, Maven Central search, and the
  PubMatic GitHub organization (github.com/PubMatic) tag lists
note: >-
  PubMatic ships no server-side REST SDKs — its client libraries are all OpenWrap
  header-bidding SDKs for app and web publishers. The Android OpenWrap SDK is NOT on Maven
  Central (the only "pubmatic" artifacts there are third-party mediation adapters published
  by AppLovin and Yodo1, recorded below as official: false), and PubMatic's own Maven
  repository host (repo.pubmatic.com) returns 404 anonymously, so its version cannot be read
  from a registry metadata endpoint.
