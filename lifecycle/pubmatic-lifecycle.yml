status_page_evidence:
  probed:
  - {url: 'https://status.pubmatic.com/', result: DNS does not resolve}
  - {url: 'https://pubmatic.com/status/', http_status: 404}
  rejected_candidates:
  - url: https://pubmatic.statuspage.io/
    http_status: 200
    reason: >-
      FALSE POSITIVE. Body is Atlassian's Statuspage product marketing page
      ("Real-Time Incident Communication with Statuspage | Atlassian"). Control probe of
      zzzznotarealcompany999.statuspage.io returns the byte-identical page, so this 200 is a
      wildcard catch-all, not a PubMatic status page.
  - url: https://pubmatic.instatus.com/
    http_status: 200
    reason: >-
      FALSE POSITIVE. Body is Instatus marketing ("Instatus - Get ready for downtime"), the
      vendor's wildcard response for an unclaimed subdomain.
  customer_only_surface:
    url: https://community.pubmatic.com/display/AN/Analytics+Status
    http_status: 200
    reason: >-
      NOT A STATUS PAGE. community.pubmatic.com now resolves to the help.pubmatic.com SPA and
      returns the byte-identical 532,437-byte shell for every path, including this one. A
      legacy Confluence "Analytics Status" page is referenced in third-party writeups but is
      no longer served at that address.
