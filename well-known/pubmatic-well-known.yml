note: >-
  RECORDED ABSENCE, NOT A PRESENCE. Every /.well-known/ path probed on every PubMatic host
  returned 404 (or an SPA/marketing catch-all), so NO WellKnown or SecurityTxt pointer is
  wired into apis.yml — this file documents that the surface is not served.
  Two false-positive shapes were caught and are recorded honestly below:
  (1) pubmatic.com answers every unknown path with an 88,741-byte WordPress 404 page at
  HTTP status 404 — correct status, so no soft-200 credit;
  (2) help.pubmatic.com answers /.well-known/* with a 302 into the ReadMe/Auth0/Okta customer
  login chain, which is a gate, not a document.
  Notably mcp.pubmatic.com serves a live MCP endpoint whose tools/list returns
  WWW-Authenticate: Bearer, yet publishes NEITHER /.well-known/oauth-authorization-server nor
  /.well-known/oauth-protected-resource — an MCP client cannot discover the authorization
  server from the resource, which is a real, fixable gap on PubMatic's side.
