apis:
- name: PubMatic MCP Server
  description: >-
    PubMatic's Model Context Protocol (MCP) server — the company's public agent-facing API
    surface for programmatic advertising. It exposes four published tools over JSON-RPC 2.0:
    deal_management (create or clone PMP, PG, Preferred and Auction Package deals),
    deal_troubleshooting (diagnose an underdelivering deal and return root causes),
    inventory_discovery (turn a natural-language campaign brief into ranked supply packages
    with forecast impressions, eCPM and a match explanation) and submit_dsp_details (fire
    live OpenRTB 2.5 bid requests at a DSP's endpoint from selected data centers and return
    validated test results). Access is granted per account by a PubMatic representative;
    tools/list is auth-gated behind a Bearer/OAuth token plus a resource-id and resource-type
    that pin the connection to one publisher, DSP, buyer or Activate advertiser.
  humanURL: https://github.com/PubMatic/pubmatic-mcp-server
  baseURL: https://mcp.pubmatic.com/mcp
